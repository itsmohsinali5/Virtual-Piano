<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Aethera Piano">
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0a0a0c"/>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="url(#glow)" stroke-opacity="0.35" stroke-width="1.5"/>
  <!-- White keys -->
  <rect x="12" y="16" width="10" height="32" rx="1.5" fill="#f4f4f5"/>
  <rect x="23" y="16" width="10" height="32" rx="1.5" fill="#e4e4e7"/>
  <rect x="34" y="16" width="10" height="32" rx="1.5" fill="#f4f4f5"/>
  <rect x="45" y="16" width="7" height="32" rx="1.5" fill="#e4e4e7"/>
  <!-- Active key highlight -->
  <rect x="23" y="16" width="10" height="32" rx="1.5" fill="#22d3ee" fill-opacity="0.35"/>
  <rect x="23" y="42" width="10" height="6" rx="1" fill="#22d3ee"/>
  <!-- Black keys -->
  <rect x="19" y="16" width="6" height="18" rx="1" fill="#18181b"/>
  <rect x="30" y="16" width="6" height="18" rx="1" fill="#18181b"/>
  <rect x="41" y="16" width="6" height="18" rx="1" fill="#18181b"/>
</svg>
